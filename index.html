<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>切水果</title>
  <style>
    :root {
      --bg1: #10261f;
      --bg2: #1b4d3e;
      --cream: #fff4d6;
      --orange: #ffb347;
      --green: #62d46b;
      --panel: rgba(255, 244, 214, 0.94);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans HK", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      color: var(--cream);
      touch-action: manipulation;
      user-select: none;
    }

    button, input { font: inherit; }
    button:disabled {
      opacity: .35;
      filter: grayscale(1);
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
    }
    .screen.active { display: flex; }

    #menuScreen {
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 10% 15%, rgba(255,179,71,.25), transparent 22%),
        radial-gradient(circle at 85% 75%, rgba(98,212,107,.20), transparent 25%),
        linear-gradient(160deg, #123326, #071611);
    }

    .menu-card {
      width: min(980px, 96vw);
      max-height: 96vh;
      overflow: auto;
      background: var(--panel);
      color: #14231c;
      border: 6px solid #10261f;
      border-radius: 28px;
      box-shadow: 0 18px 0 rgba(0,0,0,.28);
      padding: 28px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 68px);
      line-height: .95;
      letter-spacing: -2px;
    }

    .fruit-logo {
      font-size: clamp(54px, 10vw, 96px);
      filter: drop-shadow(0 8px 0 rgba(0,0,0,.15));
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .setting {
      background: #fffaf0;
      border: 4px solid #14231c;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 7px 0 rgba(0,0,0,.16);
    }

    .setting.disabled {
      opacity: .38;
      filter: grayscale(1);
    }
    .setting.disabled button {
      pointer-events: none;
      cursor: not-allowed;
      box-shadow: none;
    }

    label {
      display: block;
      font-weight: 950;
      font-size: 18px;
      margin-bottom: 10px;
    }

    input[type="number"] {
      width: 100%;
      border: 4px solid #14231c;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 24px;
      font-weight: 900;
      background: #fff;
      color: #14231c;
      min-height: 60px;
    }

    .count-control {
      display: grid;
      grid-template-columns: 76px 1fr 76px;
      align-items: center;
      gap: 12px;
    }

    .count-btn {
      border: 4px solid #14231c;
      border-radius: 18px;
      background: var(--orange);
      color: #14231c;
      min-height: 68px;
      font-size: 38px;
      font-weight: 1000;
      box-shadow: 0 6px 0 rgba(0,0,0,.2);
      cursor: pointer;
    }

    .count-display {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #14231c;
      border-radius: 18px;
      background: #fff;
      color: #14231c;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 5px 0 rgba(0,0,0,.18);
    }

    .count-hint {
      margin-top: 10px;
      color: #45685a;
      font-size: 16px;
      font-weight: 900;
      text-align: center;
    }

    .seg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .seg.six { grid-template-columns: repeat(6, 1fr); }
    .seg.two { grid-template-columns: repeat(2, 1fr); }
    .seg.four { grid-template-columns: repeat(4, 1fr); }

    .seg button {
      border: 4px solid #14231c;
      border-radius: 16px;
      background: #fff;
      min-height: 60px;
      font-size: 20px;
      font-weight: 950;
      color: #14231c;
      box-shadow: 0 5px 0 rgba(0,0,0,.18);
      cursor: pointer;
    }
    .seg button.selected {
      background: var(--orange);
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,.18);
    }

    .hint {
      margin: 10px 0 0;
      color: #45685a;
      font-size: 15px;
      font-weight: 700;
    }

    .start-row {
      display: flex;
      gap: 14px;
      margin-top: 24px;
    }

    .primary-btn, .secondary-btn {
      border: 5px solid #14231c;
      border-radius: 22px;
      min-height: 76px;
      padding: 14px 22px;
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 1000;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(0,0,0,.25);
    }
    .primary-btn { flex: 1; background: var(--green); color: #10261f; }
    .secondary-btn { background: #fff; color: #10261f; }
    .primary-btn:active, .secondary-btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 rgba(0,0,0,.25);
    }

    #gameScreen {
      flex-direction: column;
      background:
        radial-gradient(circle at 20% 18%, rgba(255,255,255,.07), transparent 18%),
        radial-gradient(circle at 80% 70%, rgba(255,179,71,.14), transparent 22%),
        linear-gradient(160deg, #124231, #071611);
    }

    .hud {
      height: 82px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(0,0,0,.28);
      border-bottom: 4px solid rgba(255,244,214,.28);
      z-index: 20;
    }
    .hud-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(18px, 3vw, 30px);
      font-weight: 1000;
      white-space: nowrap;
    }
    .hud-box.center {
      justify-content: center;
      background: rgba(255,244,214,.95);
      color: #10261f;
      border: 4px solid #10261f;
      border-radius: 999px;
      min-width: 180px;
      padding: 8px 18px;
      box-shadow: 0 5px 0 rgba(0,0,0,.25);
    }
    .hud-right { justify-content: flex-end; }

    .small-btn {
      border: 4px solid #fff4d6;
      border-radius: 16px;
      background: rgba(0,0,0,.25);
      color: var(--cream);
      min-height: 52px;
      padding: 8px 14px;
      font-size: 18px;
      font-weight: 950;
      cursor: pointer;
    }

    #playArea {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      display: grid;
      border: 5px solid rgba(255, 244, 214, .72);
      background: rgba(255, 244, 214, .045);
    }

    .grid-cell {
      border: 3px solid rgba(255, 244, 214, .72);
      box-shadow: inset 0 0 22px rgba(255, 244, 214, .06);
    }

    .fruit {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      width: var(--fruit-box, 200px);
      height: var(--fruit-box, 200px);
      transform: translate(-50%, -50%);
      animation: fruitPop .22s ease-out both, floaty 1.2s ease-in-out infinite alternate;
      filter: drop-shadow(0 12px 0 rgba(0,0,0,.18));
      z-index: 5;
    }
    .fruit .emoji {
      display: block;
      line-height: 1;
      pointer-events: none;
      font-size: var(--fruit-size, 180px);
    }
    .fruit.bomb .emoji { filter: drop-shadow(0 0 10px rgba(255,255,255,.28)); }
    .fruit:active { transform: translate(-50%, -50%) scale(.92); }

    @keyframes fruitPop {
      from { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes floaty {
      from { margin-top: -4px; }
      to { margin-top: 4px; }
    }

    .splash {
      position: absolute;
      width: 230px;
      height: 230px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      animation: splashOut .85s ease-out forwards;
    }
    .splash::before {
      content: "";
      position: absolute;
      inset: 34px;
      border-radius: 48% 52% 45% 55%;
      background: var(--splash-color, #ff5b5b);
      transform: rotate(25deg);
      box-shadow:
        -72px -28px 0 -22px var(--splash-color, #ff5b5b),
        72px -20px 0 -26px var(--splash-color, #ff5b5b),
        -48px 64px 0 -25px var(--splash-color, #ff5b5b),
        62px 58px 0 -30px var(--splash-color, #ff5b5b),
        -8px -78px 0 -30px var(--splash-color, #ff5b5b),
        0 0 0 12px rgba(255,255,255,.16);
    }

    .juice-stain {
      position: absolute;
      width: 260px;
      height: 190px;
      transform: translate(-50%, -50%) rotate(var(--angle, -8deg));
      pointer-events: none;
      z-index: 2;
      opacity: .72;
      animation: stainFade 2.2s ease-out forwards;
    }
    .juice-stain::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 150px;
      height: 82px;
      transform: translate(-50%, -50%) skewX(-18deg) rotate(-7deg);
      background: var(--splash-color, #e96d5f);
      border-radius: 48% 52% 43% 57% / 58% 48% 52% 42%;
      opacity: .62;
      filter: blur(.2px);
      box-shadow:
        -38px -12px 0 -28px var(--splash-color, #e96d5f),
        46px -6px 0 -30px var(--splash-color, #e96d5f),
        -20px 34px 0 -32px var(--splash-color, #e96d5f),
        32px 28px 0 -34px var(--splash-color, #e96d5f);
    }
    .juice-stain::after {
      content: "";
      position: absolute;
      left: 45%;
      top: 46%;
      width: 22px;
      height: 12px;
      border-radius: 999px;
      background: var(--splash-color, #e96d5f);
      opacity: .76;
      box-shadow:
        -88px -50px 0 -4px var(--splash-color, #e96d5f),
        -66px 42px 0 -7px var(--splash-color, #e96d5f),
        82px -58px 0 -5px var(--splash-color, #e96d5f),
        96px 20px 0 -7px var(--splash-color, #e96d5f),
        128px -28px 0 -8px var(--splash-color, #e96d5f),
        -118px -12px 0 -8px var(--splash-color, #e96d5f),
        18px -78px 0 -7px var(--splash-color, #e96d5f),
        -12px 66px 0 -8px var(--splash-color, #e96d5f);
    }

    .explosion {
      position: absolute;
      width: 380px;
      height: 320px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
      animation: explosionWholeOut .82s ease-out forwards;
    }

    .boom-spikes,
    .boom-back,
    .boom-mid,
    .boom-front,
    .boom-core,
    .boom-spark {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .boom-spikes {
      width: 360px;
      height: 300px;
      background: #082923;
      clip-path: polygon(
        50% 0%, 55% 29%, 70% 2%, 65% 33%, 91% 13%, 74% 42%, 100% 42%, 76% 52%,
        96% 70%, 69% 62%, 78% 100%, 57% 70%, 50% 98%, 43% 70%, 22% 100%, 31% 62%,
        4% 70%, 24% 52%, 0% 42%, 26% 42%, 9% 13%, 35% 33%, 30% 2%, 45% 29%
      );
      opacity: .98;
      animation: boomSpikes .82s ease-out forwards;
    }

    .boom-back {
      width: 305px;
      height: 210px;
      border-radius: 48% 52% 46% 54%;
      background: #f36b12;
      box-shadow:
        -118px -18px 0 -42px #f36b12,
        -78px -72px 0 -38px #f36b12,
        -28px -92px 0 -44px #f36b12,
        50px -86px 0 -38px #f36b12,
        110px -46px 0 -42px #f36b12,
        128px 22px 0 -46px #f36b12,
        78px 72px 0 -42px #f36b12,
        4px 90px 0 -36px #f36b12,
        -74px 70px 0 -40px #f36b12,
        -132px 30px 0 -44px #f36b12,
        0 0 0 12px #082923;
      animation: boomCloudBack .82s ease-out forwards;
    }

    .boom-mid {
      width: 255px;
      height: 172px;
      border-radius: 54% 46% 51% 49%;
      background: #ff9a1c;
      box-shadow:
        -92px -8px 0 -38px #ff9a1c,
        -58px -58px 0 -35px #ff9a1c,
        8px -74px 0 -38px #ffc92f,
        72px -52px 0 -35px #ff9a1c,
        100px 4px 0 -40px #ff9a1c,
        66px 58px 0 -39px #ff9a1c,
        -14px 72px 0 -34px #ff9a1c,
        -80px 46px 0 -37px #ff9a1c;
      animation: boomCloudMid .82s ease-out forwards;
    }

    .boom-front {
      width: 205px;
      height: 126px;
      border-radius: 56% 44% 53% 47%;
      background: #ffc72f;
      box-shadow:
        -62px -4px 0 -28px #ffc72f,
        -28px -46px 0 -30px #ffc72f,
        36px -40px 0 -29px #ffc72f,
        66px 4px 0 -31px #ffc72f,
        36px 42px 0 -30px #ffc72f,
        -36px 40px 0 -28px #ffc72f;
      animation: boomCloudFront .82s ease-out forwards;
    }

    .boom-core {
      width: 122px;
      height: 86px;
      border-radius: 50%;
      background: #fff7df;
      box-shadow:
        -48px -8px 0 -26px #fff7df,
        48px -6px 0 -28px #fff7df,
        0 34px 0 -30px #fff7df;
      opacity: .9;
      animation: boomCoreFlash .36s ease-out forwards;
    }

    .boom-spark {
      width: 28px;
      height: 14px;
      border-radius: 999px 999px 999px 0;
      background: #ffb21f;
      box-shadow: 0 0 0 5px #082923;
      opacity: .95;
      transform: translate(-50%, -50%) rotate(var(--r, 0deg));
      animation: boomSpark .82s ease-out forwards;
    }

    .boom-spark.s1 { --tx: -185px; --ty: -72px; --r: 25deg; }
    .boom-spark.s2 { --tx: 178px; --ty: -92px; --r: -20deg; }
    .boom-spark.s3 { --tx: -166px; --ty: 98px; --r: -28deg; }
    .boom-spark.s4 { --tx: 188px; --ty: 76px; --r: 32deg; }
    .boom-spark.s5 { --tx: -32px; --ty: -146px; --r: 90deg; }
    .boom-spark.s6 { --tx: 24px; --ty: 146px; --r: -90deg; }

    .slice-text {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 12;
      font-size: 34px;
      font-weight: 1000;
      color: #fff4d6;
      text-shadow: 0 4px 0 rgba(0,0,0,.35);
      animation: textUp .7s ease-out forwards;
    }

    @keyframes splashOut {
      from { opacity: 1; transform: translate(-50%, -50%) scale(.22) rotate(0deg); }
      to { opacity: 0; transform: translate(-50%, -50%) scale(1.55) rotate(36deg); }
    }
    @keyframes stainFade {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--angle, -8deg)) scale(.45); }
      12% { opacity: .72; transform: translate(-50%, -50%) rotate(var(--angle, -8deg)) scale(1); }
      48% { opacity: .46; transform: translate(-50%, -50%) rotate(var(--angle, -8deg)) scale(1.02); }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--angle, -8deg)) scale(1.04); }
    }
    @keyframes explosionOut {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(.25) rotate(0deg); }
      45% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(12deg); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.75) rotate(28deg); }
    }
    @keyframes explosionWholeOut {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.25); }
      10% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
      68% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.22); }
    }

    @keyframes boomSpikes {
      0% { transform: translate(-50%, -50%) scale(.2) rotate(-8deg); }
      18% { transform: translate(-50%, -50%) scale(1.12) rotate(0deg); }
      100% { transform: translate(-50%, -50%) scale(1.04) rotate(2deg); }
    }

    @keyframes boomCloudBack {
      0% { transform: translate(-50%, -50%) scale(.28); }
      24% { transform: translate(-50%, -50%) scale(1.08); }
      100% { transform: translate(-50%, -50%) scale(1.02); }
    }

    @keyframes boomCloudMid {
      0% { transform: translate(-50%, -50%) scale(.22); }
      20% { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1.04); }
    }

    @keyframes boomCloudFront {
      0% { transform: translate(-50%, -50%) scale(.2); }
      20% { transform: translate(-50%, -50%) scale(1.12); }
      100% { transform: translate(-50%, -50%) scale(1.04); }
    }

    @keyframes boomCoreFlash {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
      35% { opacity: .95; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.55); }
    }

    @keyframes boomSpark {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(var(--r, 0deg)); }
      18% { opacity: 1; transform: translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, 0px))) scale(1) rotate(var(--r, 0deg)); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, 0px))) scale(.8) rotate(var(--r, 0deg)); }
    }
    @keyframes textUp {
      from { opacity: 1; transform: translate(-50%, -50%) translateY(0) scale(.8); }
      to { opacity: 0; transform: translate(-50%, -50%) translateY(-70px) scale(1.15); }
    }

    .end-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.55);
      z-index: 99;
    }
    .end-modal.active { display: flex; }
    .end-card {
      width: min(680px, 94vw);
      background: var(--panel);
      color: #10261f;
      border: 6px solid #10261f;
      border-radius: 28px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 18px 0 rgba(0,0,0,.35);
    }
    .end-card h2 {
      margin: 0 0 12px;
      font-size: clamp(38px, 7vw, 68px);
    }
    .score-big {
      font-size: clamp(42px, 8vw, 82px);
      font-weight: 1000;
      color: #e04b3f;
      line-height: 1;
      margin: 12px 0 20px;
    }
    .end-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
    }

    @media (max-width: 720px) {
      .menu-card { padding: 18px; border-radius: 22px; }
      .settings-grid { grid-template-columns: 1fr; gap: 12px; }
      .seg.six { grid-template-columns: repeat(3, 1fr); }
      .seg.four { grid-template-columns: repeat(2, 1fr); }
      .title-row { align-items: flex-start; }
      .hud {
        height: 72px;
        grid-template-columns: 1fr auto auto;
        padding: 8px 10px;
      }
      .hud-box.center { min-width: 118px; padding: 6px 10px; }
      .hud .label-word { display: none; }
      .small-btn { min-height: 48px; padding: 7px 10px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <section id="menuScreen" class="screen active">
    <div class="menu-card">
      <div class="title-row">
        <h1>切水果</h1>
        <div class="fruit-logo">🍉</div>
      </div>

      <div class="settings-grid">
        <div class="setting">
          <label for="spawnSeconds">水果出現時間（秒）</label>
          <input id="spawnSeconds" type="number" min="0.5" max="20" step="0.5" value="3" />
          <p class="hint">水果停留幾耐先自動消失。</p>
        </div>

        <div class="setting">
          <label>每次出現水果數量</label>
          <div class="count-control" aria-label="每次出現水果數量">
            <button id="countMinusBtn" class="count-btn" type="button">－</button>
            <div id="fruitCountDisplay" class="count-display">1 個</div>
            <button id="countPlusBtn" class="count-btn" type="button">＋</button>
          </div>
          <div id="fruitCountHint" class="count-hint">目前模式最多 6 個水果</div>
        </div>

        <div id="gameTimeSetting" class="setting">
          <label>遊戲時間</label>
          <div class="seg" data-setting="gameTime">
            <button data-value="30" class="selected">30秒</button>
            <button data-value="60">1分鐘</button>
            <button data-value="120">2分鐘</button>
          </div>
        </div>

        <div class="setting">
          <label>水果大小</label>
          <div class="seg four" data-setting="fruitSize">
            <button data-value="xlarge">超大</button>
            <button data-value="large" class="selected">大</button>
            <button data-value="medium">中</button>
            <button data-value="small">細</button>
          </div>
        </div>

        <div class="setting">
          <label>版面模式</label>
          <div class="seg four" data-setting="layoutMode">
            <button data-value="free" class="selected">自由</button>
            <button data-value="1x2">1×2</button>
            <button data-value="2x2">2×2</button>
            <button data-value="3x3">3×3</button>
          </div>
          <p class="hint">把畫面分為不同格數，水果會出現在格中。</p>
        </div>

        <div class="setting">
          <label>炸彈</label>
          <div class="seg two" data-setting="bombs">
            <button data-value="off" class="selected">不要</button>
            <button data-value="on">加入</button>
          </div>
          <p class="hint">點中炸彈不會扣分。</p>
        </div>

        <div class="setting">
          <label>計時模式</label>
          <div class="seg two" data-setting="timedMode">
            <button data-value="on" class="selected">計時</button>
            <button data-value="off">不計時</button>
          </div>
          <p class="hint">不計時模式適合自由練習，可手動停止。</p>
        </div>
      </div>

      <div class="start-row">
        <button id="startBtn" class="primary-btn">開始遊戲</button>
      </div>
    </div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="hud">
      <div class="hud-box"><span class="label-word">分數</span> ⭐ <span id="scoreText">0</span></div>
      <div class="hud-box center">⏱ <span id="timeText">30</span></div>
      <div class="hud-box hud-right">
        <button id="soundBtn" class="small-btn">🔊</button>
        <button id="stopBtn" class="small-btn">停止</button>
      </div>
    </div>
    <div id="playArea" aria-label="遊戲區域"></div>
  </section>

  <div id="endModal" class="end-modal">
    <div class="end-card">
      <h2>完成！</h2>
      <div class="score-big">今次切到 <span id="finalScore">0</span></div>
      <div class="end-actions">
        <button id="againBtn" class="primary-btn">再玩一次</button>
        <button id="menuBtn" class="secondary-btn">返回設定</button>
      </div>
    </div>
  </div>

  <script>
    const menuScreen = document.getElementById('menuScreen');
    const gameScreen = document.getElementById('gameScreen');
    const playArea = document.getElementById('playArea');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const soundBtn = document.getElementById('soundBtn');
    const scoreText = document.getElementById('scoreText');
    const timeText = document.getElementById('timeText');
    const endModal = document.getElementById('endModal');
    const finalScore = document.getElementById('finalScore');
    const againBtn = document.getElementById('againBtn');
    const menuBtn = document.getElementById('menuBtn');
    const spawnSecondsInput = document.getElementById('spawnSeconds');
    const gameTimeSetting = document.getElementById('gameTimeSetting');
    const countMinusBtn = document.getElementById('countMinusBtn');
    const countPlusBtn = document.getElementById('countPlusBtn');
    const fruitCountDisplay = document.getElementById('fruitCountDisplay');
    const fruitCountHint = document.getElementById('fruitCountHint');

    const fruits = [
      '🍉','🍊','🍎','🍓','🥝','🍌','🍐','🍑','🍇',
      '🍒','🥭','🍋','🫐','🍈','🍅','🥥','🍏'
    ];
    const splashColors = ['#d96b5f', '#e85f57', '#ee9b22', '#d8a81f', '#8fa83a', '#b24a67', '#5b7ee8', '#e0cf52'];
    let currentWaveFruits = [];

    const settings = {
      fruitCount: 1,
      gameTime: 30,
      fruitSize: 'large',
      bombs: 'off',
      timedMode: 'on',
      layoutMode: 'free'
    };

    let score = 0;
    let timeLeft = 30;
    let running = false;
    let soundOn = true;
    let spawnTimer = null;
    let countdownTimer = null;
    let audioCtx = null;

    document.querySelectorAll('.seg').forEach(group => {
      group.addEventListener('click', event => {
        const btn = event.target.closest('button');
        if (!btn || btn.disabled) return;

        group.querySelectorAll('button').forEach(item => item.classList.remove('selected'));
        btn.classList.add('selected');

        const key = group.dataset.setting;
        const value = btn.dataset.value;
        settings[key] = key === 'gameTime' ? Number(value) : value;

        if (key === 'timedMode') updateTimedModeUI();
        if (key === 'fruitSize' || key === 'layoutMode') updateFruitCountOptions();
      });
    });

    countMinusBtn.addEventListener('click', () => {
      const maxCount = getMaxFruitCount();
      settings.fruitCount = Math.max(1, settings.fruitCount - 1);
      settings.fruitCount = Math.min(settings.fruitCount, maxCount);
      updateFruitCountOptions();
    });

    countPlusBtn.addEventListener('click', () => {
      const maxCount = getMaxFruitCount();
      settings.fruitCount = Math.min(maxCount, settings.fruitCount + 1);
      updateFruitCountOptions();
    });

    updateTimedModeUI();
    updateFruitCountOptions();

    startBtn.addEventListener('click', startGame);
    stopBtn.addEventListener('click', endGame);
    againBtn.addEventListener('click', () => {
      endModal.classList.remove('active');
      startGame();
    });
    menuBtn.addEventListener('click', () => {
      endModal.classList.remove('active');
      showMenu();
    });
    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? '🔊' : '🔇';
    });

    playArea.addEventListener('click', event => {
      if (!running || settings.layoutMode === 'free') return;
      if (event.target.closest('.fruit')) return;

      const targetFruit = findFruitInClickedCell(event.clientX, event.clientY);
      if (targetFruit) targetFruit.click();
    });

    function startGame() {
      const spawnSeconds = clampNumber(Number(spawnSecondsInput.value), 0.5, 20, 3);
      spawnSecondsInput.value = spawnSeconds;

      score = 0;
      timeLeft = settings.gameTime;
      running = true;
      scoreText.textContent = score;
      timeText.textContent = settings.timedMode === 'on' ? timeLeft : '∞';
      playArea.innerHTML = '';
      menuScreen.classList.remove('active');
      gameScreen.classList.add('active');
      endModal.classList.remove('active');

      clearTimers();
      spawnWave();

      if (settings.timedMode === 'on') {
        countdownTimer = setInterval(() => {
          timeLeft -= 1;
          timeText.textContent = timeLeft;
          if (timeLeft <= 0) endGame();
        }, 1000);
      }
    }

    function showMenu() {
      running = false;
      clearTimers();
      playArea.innerHTML = '';
      gameScreen.classList.remove('active');
      menuScreen.classList.add('active');
    }

    function endGame() {
      if (!running) return;
      running = false;
      clearTimers();
      playArea.innerHTML = '';
      finalScore.textContent = score + ' 個';
      endModal.classList.add('active');
    }

    function clearTimers() {
      clearTimeout(spawnTimer);
      clearInterval(countdownTimer);
      spawnTimer = null;
      countdownTimer = null;
    }

    function getSpawnIntervalMs() {
      const spawnSeconds = clampNumber(Number(spawnSecondsInput.value), 0.5, 20, 3);
      return Math.max(600, spawnSeconds * 1000);
    }

    function scheduleNextWave() {
      clearTimeout(spawnTimer);
      spawnTimer = null;
      if (!running) return;
      spawnTimer = setTimeout(spawnWave, getSpawnIntervalMs());
    }

    function spawnWave() {
      if (!running) return;
      playArea.querySelectorAll('.fruit').forEach(el => el.remove());
      updateGridOverlay();
      const positions = makePositions(settings.fruitCount);

      const fruitPool = shuffle(fruits.slice());
      currentWaveFruits = fruitPool.slice(0, positions.length);

      positions.forEach((pos, index) => {
        const includeBomb = settings.bombs === 'on' && Math.random() < 0.18;
        const fruitEmoji = currentWaveFruits[index];
        createFruit(pos.x, pos.y, includeBomb, pos.size, fruitEmoji);
      });

      scheduleNextWave();
    }

    function getGridConfig(mode) {
      const gridMap = {
        '1x2': { rows: 1, cols: 2 },
        '2x2': { rows: 2, cols: 2 },
        '3x3': { rows: 3, cols: 3 }
      };
      return gridMap[mode] || null;
    }

    function updateGridOverlay() {
      playArea.querySelectorAll('.grid-overlay').forEach(el => el.remove());
      const grid = getGridConfig(settings.layoutMode);
      if (!grid) return;

      const overlay = document.createElement('div');
      overlay.className = 'grid-overlay';
      overlay.style.gridTemplateColumns = `repeat(${grid.cols}, 1fr)`;
      overlay.style.gridTemplateRows = `repeat(${grid.rows}, 1fr)`;

      for (let i = 0; i < grid.rows * grid.cols; i++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        overlay.appendChild(cell);
      }

      playArea.appendChild(overlay);
    }

    function getCellFromPoint(clientX, clientY) {
      const grid = getGridConfig(settings.layoutMode);
      if (!grid) return null;

      const rect = playArea.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      if (x < 0 || y < 0 || x > rect.width || y > rect.height) return null;

      const col = Math.min(grid.cols - 1, Math.max(0, Math.floor(x / (rect.width / grid.cols))));
      const row = Math.min(grid.rows - 1, Math.max(0, Math.floor(y / (rect.height / grid.rows))));
      return { row, col, rows: grid.rows, cols: grid.cols };
    }

    function getCellFromPosition(x, y) {
      const grid = getGridConfig(settings.layoutMode);
      if (!grid) return null;

      const rect = getPlayRect();
      const col = Math.min(grid.cols - 1, Math.max(0, Math.floor(x / (rect.width / grid.cols))));
      const row = Math.min(grid.rows - 1, Math.max(0, Math.floor(y / (rect.height / grid.rows))));
      return { row, col, rows: grid.rows, cols: grid.cols };
    }

    function findFruitInClickedCell(clientX, clientY) {
      const clickedCell = getCellFromPoint(clientX, clientY);
      if (!clickedCell) return null;

      const fruitsOnScreen = Array.from(playArea.querySelectorAll('.fruit'));
      return fruitsOnScreen.find(fruitEl => {
        const fruitCell = getCellFromPosition(parseFloat(fruitEl.style.left), parseFloat(fruitEl.style.top));
        return fruitCell && fruitCell.row === clickedCell.row && fruitCell.col === clickedCell.col;
      });
    }

    function makePositions(requestedCount) {
      const rect = getPlayRect();
      const selectedSize = getFruitVisualSize(settings.fruitSize, rect.width);

      if (settings.layoutMode !== 'free') {
        return makeGridPositions(settings.layoutMode, rect, selectedSize, requestedCount);
      }

      return makeFreePositions(rect, selectedSize, requestedCount);
    }

    function makeFreePositions(rect, selectedSize, requestedCount) {
      const size = Math.min(selectedSize, Math.max(78, rect.width * 0.36), Math.max(78, rect.height * 0.42));
      const edgePadding = Math.ceil(size * 0.58);
      const minDistance = Math.ceil(size * 1.18);
      const left = edgePadding;
      const right = Math.max(edgePadding, rect.width - edgePadding);
      const top = edgePadding;
      const bottom = Math.max(edgePadding, rect.height - edgePadding);
      const positions = [];
      let attempts = 0;

      while (positions.length < requestedCount && attempts < 3500) {
        attempts++;
        const x = randomBetween(left, right);
        const y = randomBetween(top, bottom);
        const safe = positions.every(pos => distance(pos, { x, y }) >= minDistance);
        if (safe) positions.push({ x, y, size });
      }

      return positions;
    }

    function makeGridPositions(mode, rect, selectedSize, requestedCount) {
      const grid = getGridConfig(mode) || { rows: 2, cols: 2 };
      const cellWidth = rect.width / grid.cols;
      const cellHeight = rect.height / grid.rows;
      const size = Math.floor(Math.min(selectedSize, cellWidth * 0.66, cellHeight * 0.66));
      const finalSize = Math.max(64, size);
      const positions = [];

      for (let row = 0; row < grid.rows; row++) {
        for (let col = 0; col < grid.cols; col++) {
          positions.push({
            x: cellWidth * (col + 0.5),
            y: cellHeight * (row + 0.5),
            size: finalSize
          });
        }
      }

      shuffle(positions);
      return positions.slice(0, Math.min(requestedCount, positions.length));
    }

    function getFruitVisualSize(sizeName, viewportWidth) {
      const vw = viewportWidth / 100;
      const sizes = {
        xlarge: Math.min(Math.max(240, 26 * vw), 380),
        large: Math.min(Math.max(180, 20 * vw), 280),
        medium: Math.min(Math.max(145, 16 * vw), 230),
        small: Math.min(Math.max(70, 7.5 * vw), 110)
      };
      return sizes[sizeName] || sizes.large;
    }

    function spawnReplacementFruit() {
      if (!running) return;

      const activeItems = Array.from(playArea.querySelectorAll('.fruit'));
      if (activeItems.length >= settings.fruitCount) return;

      const rect = getPlayRect();
      const selectedSize = getFruitVisualSize(settings.fruitSize, rect.width);
      const position = makeReplacementPosition(rect, selectedSize, activeItems);
      const includeBomb = settings.bombs === 'on' && Math.random() < 0.18;
      const fruitEmoji = getAvailableFruitEmoji();

      createFruit(position.x, position.y, includeBomb, position.size, fruitEmoji);
    }

    function makeReplacementPosition(rect, selectedSize, activeItems) {
      const activePositions = activeItems.map(el => ({
        x: parseFloat(el.style.left),
        y: parseFloat(el.style.top),
        size: parseFloat(el.style.getPropertyValue('--fruit-size')) || selectedSize
      }));

      if (settings.layoutMode !== 'free') {
        const gridPositions = makeGridPositions(settings.layoutMode, rect, selectedSize, 9);
        const shuffled = shuffle(gridPositions.slice());
        const found = shuffled.find(pos => activePositions.every(active => distance(active, pos) >= Math.min(active.size, pos.size) * 0.92));
        if (found) return found;
        return shuffled[0] || { x: rect.width / 2, y: rect.height / 2, size: selectedSize };
      }

      const candidates = makeFreePositions(rect, selectedSize, Math.max(settings.fruitCount * 3, 12));
      const found = candidates.find(pos => activePositions.every(active => distance(active, pos) >= Math.min(active.size, pos.size) * 1.05));
      if (found) return found;

      const size = Math.min(selectedSize, Math.max(78, rect.width * 0.36), Math.max(78, rect.height * 0.42));
      return {
        x: randomBetween(size * 0.6, Math.max(size * 0.6, rect.width - size * 0.6)),
        y: randomBetween(size * 0.6, Math.max(size * 0.6, rect.height - size * 0.6)),
        size
      };
    }

    function getAvailableFruitEmoji() {
      const used = new Set(
        Array.from(playArea.querySelectorAll('.fruit .emoji'))
          .map(el => el.textContent)
          .filter(value => value && value !== '💣')
      );
      const available = shuffle(fruits.filter(fruit => !used.has(fruit)));
      if (available.length > 0) return available[0];
      return shuffle(fruits.slice())[0];
    }

    function createFruit(x, y, isBomb, size, fruitEmoji) {
      const btn = document.createElement('button');
      btn.className = 'fruit' + (isBomb ? ' bomb' : '');
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
      btn.style.setProperty('--fruit-size', size + 'px');
      btn.style.setProperty('--fruit-box', Math.ceil(size * 1.05) + 'px');
      btn.setAttribute('aria-label', isBomb ? '炸彈' : '水果');

      const emoji = document.createElement('span');
      emoji.className = 'emoji';
      emoji.textContent = isBomb ? '💣' : fruitEmoji;
      btn.appendChild(emoji);

      btn.addEventListener('click', () => {
        if (!running || btn.dataset.hit === '1') return;
        btn.dataset.hit = '1';
        const px = parseFloat(btn.style.left);
        const py = parseFloat(btn.style.top);

        if (isBomb) {
          createExplosion(px, py);
          playSound('bomb');
        } else {
          score += 1;
          scoreText.textContent = score;
          const color = getJuiceColor(emoji.textContent);
          createJuiceStain(px, py, color);
          createSplash(px, py, color);
          createFloatingText(px, py, '+1');
          playSound('cut');
        }

        btn.remove();
        if (running) {
          // Reset the wave timer so the replacement fruit will not be cleared immediately
          // by an old scheduled wave that was about to fire.
          scheduleNextWave();
          setTimeout(spawnReplacementFruit, 90);
        }
      });

      playArea.appendChild(btn);
    }

    function createSplash(x, y, color) {
      const splash = document.createElement('div');
      splash.className = 'splash';
      splash.style.left = x + 'px';
      splash.style.top = y + 'px';
      splash.style.setProperty('--splash-color', color);
      playArea.appendChild(splash);
      setTimeout(() => splash.remove(), 900);
    }

    function createJuiceStain(x, y, color) {
      const stain = document.createElement('div');
      stain.className = 'juice-stain';
      stain.style.left = x + 'px';
      stain.style.top = y + 'px';
      stain.style.setProperty('--splash-color', color);
      stain.style.setProperty('--angle', (Math.random() * 70 - 35) + 'deg');
      playArea.appendChild(stain);
      setTimeout(() => stain.remove(), 2300);
    }

    function createExplosion(x, y) {
      const explosion = document.createElement('div');
      explosion.className = 'explosion';
      explosion.style.left = x + 'px';
      explosion.style.top = y + 'px';
      explosion.innerHTML = `
        <div class="boom-spikes"></div>
        <div class="boom-back"></div>
        <div class="boom-mid"></div>
        <div class="boom-core"></div>
        <div class="boom-front"></div>
        <div class="boom-spark s1"></div>
        <div class="boom-spark s2"></div>
        <div class="boom-spark s3"></div>
        <div class="boom-spark s4"></div>
        <div class="boom-spark s5"></div>
        <div class="boom-spark s6"></div>
      `;
      playArea.appendChild(explosion);
      setTimeout(() => explosion.remove(), 900);
    }

    function createFloatingText(x, y, text) {
      const el = document.createElement('div');
      el.className = 'slice-text';
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      playArea.appendChild(el);
      setTimeout(() => el.remove(), 750);
    }

    function getJuiceColor(fruit) {
      const map = {
        '🍉': '#d96b5f',
        '🍓': '#c94f58',
        '🍎': '#d85b55',
        '🍊': '#e88a22',
        '🍌': '#d9b638',
        '🍐': '#9aa844',
        '🥝': '#7f9f3b',
        '🍑': '#de806b',
        '🍇': '#8a5c91',
        '🍒': '#c63d4f',
        '🥭': '#f0a12d',
        '🍋': '#d8c63d',
        '🫐': '#4d69c7',
        '🍈': '#89b15f',
        '🍅': '#cf4c42',
        '🥥': '#9a7557',
        '🍏': '#87c95f'
      };
      return map[fruit] || splashColors[Math.floor(Math.random() * splashColors.length)];
    }

    function playSound(type) {
      if (!soundOn) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'cut') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520 + Math.random() * 180, now);
          osc.frequency.exponentialRampToValueAtTime(900 + Math.random() * 250, now + 0.08);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.16, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.start(now);
          osc.stop(now + 0.14);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(130, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.18);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.24);
        }
      } catch (error) {
        console.warn('Sound unavailable:', error);
      }
    }

    function updateTimedModeUI() {
      const disabled = settings.timedMode === 'off';
      gameTimeSetting.classList.toggle('disabled', disabled);
      gameTimeSetting.querySelectorAll('button').forEach(btn => {
        btn.disabled = disabled;
        btn.setAttribute('aria-disabled', disabled ? 'true' : 'false');
      });
    }

    function getMaxFruitCount() {
      const layoutMaxMap = {
        free: 9,
        '1x2': 2,
        '2x2': 4,
        '3x3': 9
      };
      const freeSizeMaxMap = {
        xlarge: 4,
        large: 6,
        medium: 7,
        small: 9
      };
      const layoutMax = layoutMaxMap[settings.layoutMode] || 9;
      const sizeMax = settings.layoutMode === 'free'
        ? (freeSizeMaxMap[settings.fruitSize] || 9)
        : (settings.fruitSize === 'xlarge' ? 4 : 9);
      return Math.min(layoutMax, sizeMax);
    }

    function updateFruitCountOptions() {
      const maxCount = getMaxFruitCount();

      if (settings.fruitCount > maxCount) {
        settings.fruitCount = maxCount;
      }
      if (settings.fruitCount < 1) {
        settings.fruitCount = 1;
      }

      fruitCountDisplay.textContent = settings.fruitCount + ' 個';
      fruitCountHint.textContent = '目前模式最多 ' + maxCount + ' 個水果';
      countMinusBtn.disabled = settings.fruitCount <= 1;
      countPlusBtn.disabled = settings.fruitCount >= maxCount;
      countMinusBtn.setAttribute('aria-disabled', countMinusBtn.disabled ? 'true' : 'false');
      countPlusBtn.setAttribute('aria-disabled', countPlusBtn.disabled ? 'true' : 'false');
    }

    function getPlayRect() {
      const rect = playArea.getBoundingClientRect();
      return {
        width: Math.max(320, rect.width || window.innerWidth || 320),
        height: Math.max(320, rect.height || (window.innerHeight - 82) || 320)
      };
    }

    function clampNumber(value, min, max, fallback) {
      if (!Number.isFinite(value)) return fallback;
      return Math.min(max, Math.max(min, value));
    }

    function randomBetween(min, max) {
      return min + Math.random() * Math.max(0, max - min);
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = array[i];
        array[i] = array[j];
        array[j] = temp;
      }
      return array;
    }

    function runSelfTests() {
      const original = { ...settings };
      const results = [];

      function assert(name, condition) {
        results.push({ name, pass: Boolean(condition) });
        if (!condition) console.warn('Self test failed:', name);
      }

      try {
        settings.fruitSize = 'large';
        settings.layoutMode = 'free';
        settings.fruitCount = 6;
        const freePositions = makePositions(6);
        assert('free mode returns an array', Array.isArray(freePositions));
        assert('free mode does not exceed requested count', freePositions.length <= 6);
        assert('free mode positions have numeric x/y/size', freePositions.every(p => Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(p.size)));
        assert('free mode avoids overlap', freePositions.every((p, i) => freePositions.every((q, j) => i === j || distance(p, q) >= Math.min(p.size, q.size))));

        settings.fruitSize = 'xlarge';
        settings.layoutMode = '1x2';
        settings.fruitCount = 6;
        const grid12 = makePositions(6);
        const rect = getPlayRect();
        assert('1x2 mode caps at 2 cells', grid12.length <= 2);
        assert('1x2 mode is centred vertically', grid12.every(p => Math.abs(p.y - rect.height / 2) < 2));
        assert('1x2 mode positions are inside play area', grid12.every(p => p.x >= 0 && p.x <= rect.width && p.y >= 0 && p.y <= rect.height));

        settings.layoutMode = '2x2';
        const grid22 = makePositions(6);
        assert('2x2 mode caps at 4 cells', grid22.length <= 4);
        assert('2x2 mode has numeric size', grid22.every(p => Number.isFinite(p.size)));

        settings.layoutMode = '3x3';
        const grid33 = makePositions(6);
        assert('3x3 mode allows up to requested count', grid33.length <= 6);
        assert('3x3 mode has numeric coordinates', grid33.every(p => Number.isFinite(p.x) && Number.isFinite(p.y)));

        const sizeOrder = ['small', 'medium', 'large', 'xlarge'].map(name => getFruitVisualSize(name, 1000));
        assert('fruit size order is small < medium < large < xlarge', sizeOrder[0] < sizeOrder[1] && sizeOrder[1] < sizeOrder[2] && sizeOrder[2] < sizeOrder[3]);
        assert('medium and small have clear size gap', sizeOrder[1] - sizeOrder[0] >= 35);
        assert('pineapple emoji is removed', !fruits.includes('🍍'));
        assert('fruit list has many fruit types', new Set(fruits).size >= 15);
        assert('fruit source list has no duplicates', new Set(fruits).size === fruits.length);
        const uniqueWave = shuffle(fruits.slice()).slice(0, 6);
        assert('wave fruits are unique', new Set(uniqueWave).size === uniqueWave.length);

        settings.fruitSize = 'xlarge';
        settings.layoutMode = 'free';
        settings.fruitCount = 6;
        updateFruitCountOptions();
        assert('xlarge caps selected fruit count at 4', settings.fruitCount === 4);
        assert('xlarge count control max is 4', getMaxFruitCount() === 4);
        assert('xlarge plus button disabled at max', countPlusBtn.disabled === true);

        settings.fruitSize = 'large';
        settings.layoutMode = 'free';
        settings.fruitCount = 9;
        updateFruitCountOptions();
        assert('free large caps at 6', settings.fruitCount === 6 && getMaxFruitCount() === 6);

        settings.fruitSize = 'medium';
        settings.layoutMode = 'free';
        settings.fruitCount = 9;
        updateFruitCountOptions();
        assert('free medium caps at 7', settings.fruitCount === 7 && getMaxFruitCount() === 7);

        settings.fruitSize = 'small';
        settings.layoutMode = 'free';
        settings.fruitCount = 9;
        updateFruitCountOptions();
        assert('free small allows 9', settings.fruitCount === 9 && getMaxFruitCount() === 9);

        settings.fruitSize = 'large';
        settings.layoutMode = '1x2';
        settings.fruitCount = 9;
        updateFruitCountOptions();
        assert('1x2 caps selected fruit count at 2', settings.fruitCount === 2);
        assert('1x2 max is 2', getMaxFruitCount() === 2);

        settings.layoutMode = '2x2';
        settings.fruitCount = 9;
        updateFruitCountOptions();
        assert('2x2 caps selected fruit count at 4', settings.fruitCount === 4);
        assert('2x2 max is 4', getMaxFruitCount() === 4);

        settings.layoutMode = '3x3';
        settings.fruitCount = 9;
        updateFruitCountOptions();
        assert('3x3 allows fruit count 9', settings.fruitCount === 9);
        assert('3x3 max is 9', getMaxFruitCount() === 9);
        assert('grid config 1x2 has 1 row 2 cols', getGridConfig('1x2').rows === 1 && getGridConfig('1x2').cols === 2);
        assert('grid config 3x3 has 9 cells', getGridConfig('3x3').rows * getGridConfig('3x3').cols === 9);
      } catch (error) {
        console.error('Self tests crashed:', error);
        results.push({ name: 'self tests should not crash', pass: false });
      } finally {
        Object.assign(settings, original);
      }

      const failed = results.filter(result => !result.pass).length;
      console.log('Fruit game self tests: ' + (results.length - failed) + '/' + results.length + ' passed');
      return failed === 0;
    }

    runSelfTests();

    window.addEventListener('resize', () => {
      if (running) spawnWave();
    });
  </script>
</body>
</html>
